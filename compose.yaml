# Hatchtower mit Docker Compose
#   docker compose up -d --build
#   docker compose logs hatchtower      → Einrichtungscode für den Assistenten
# Danach http://<server>:8000/setup öffnen. Im Internet nur hinter einem Reverse-Proxy mit HTTPS betreiben.
services:
  hatchtower:
    build: .
    image: hatchtower:local
    container_name: hatchtower
    restart: unless-stopped
    ports:
      - "8000:8000"            # nur hinter Reverse-Proxy: "127.0.0.1:8000:8000"
    environment:
      HATCHTOWER_TZ: Europe/Berlin
      # Öffentliche Demo (nur lesen), siehe docs/public-demo.md:
      # HATCHTOWER_DEMO_USER: demo
    volumes:
      - hatchtower-data:/var/lib/hatchtower
      # Ziel für Backups (erscheint in Hatchtower unter „Datenträger“):
      # - /srv/backups/hatchtower:/mnt/backups

volumes:
  hatchtower-data:
