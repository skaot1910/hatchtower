{# Interface icons: one stroke style (24 px grid, 1.8 stroke, round joins), coloured with currentColor.
   Usage: {% import "_icons.html" as ic %} … {{ ic.icon("play") }} #}
{% macro icon(name, cls="") %}<svg class="ico-ui ico-{{ name }} {{ cls }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "play" %}<path d="M8 5.5v13l10.5-6.5z"/>
{%- elif name == "restart" %}<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/>
{%- elif name == "stop" %}<rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>
{%- elif name == "kill" %}<path d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
{%- elif name == "star" %}<path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/>
{%- elif name == "tiles" %}<rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/>
{%- elif name == "list" %}<path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>
{%- elif name == "external" %}<path d="M14 4.5h5.5V10"/><path d="M19.5 4.5L11 13"/><path d="M18 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H10"/>
{%- elif name == "chevron-up" %}<path d="M7 14.5l5-5 5 5"/>
{%- elif name == "moon" %}<path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="3.8"/><path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/>
{%- elif name == "close" %}<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
{%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "bell" %}<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
{%- endif %}</svg>{% endmacro %}
