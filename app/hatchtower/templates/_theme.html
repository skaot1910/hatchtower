{% import "_icons.html" as ic %}
{# Theme switch (dark/light), import with context (needs theme and here) #}
{% macro switch(themes_list) %}<span class="theme-switch" role="group" aria-label="{{ _("Darstellung") }}">{% for t in themes_list %}<a href="/theme/{{ t.key }}?next={{ here|urlencode }}" data-theme-key="{{ t.key }}" title="{{ _(t.name) }}"{% if t.key == theme %} class="is-current" aria-current="true"{% endif %}>{{ ic.icon(t.icon, "theme-icon") }}<span class="theme-label">{{ _(t.name) }}</span></a>{% endfor %}</span>{% endmacro %}
